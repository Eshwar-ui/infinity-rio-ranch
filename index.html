<!doctype html>
<!--
  data-theme/data-accent match the theme store's defaults. ThemeProvider sets
  them from the store after mount, but the prerendered HTML paints before that —
  without them here, :root's dark tokens would show for a frame and then flip to
  light on every load.
-->
<html lang="en-US" data-theme="light" data-accent="brass">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      Fonts are self-hosted (see the @font-face block in src/index.css) — no
      third-party origin to resolve. These two carry the above-the-fold text:
      Cormorant Garamond for the h1, Jost for body copy. Preloading them lets the
      swap land before the first paint instead of shifting layout afterwards.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/cormorant-garamond.woff2"
      crossorigin
    />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/jost.woff2" crossorigin />

    <!--
      Homepage LCP candidates: the first hero slide and the nav logo. imagesrcset
      must mirror what <SmartImage> renders, or the browser preloads one file and
      then requests a different one.
    -->
    <link
      rel="preload"
      as="image"
      href="/assets/site/DSC3699-2.jpg"
      imagesrcset="/assets/_r/site/DSC3699-2-480.jpg 480w, /assets/_r/site/DSC3699-2-720.jpg 720w, /assets/_r/site/DSC3699-2-960.jpg 960w, /assets/site/DSC3699-2.jpg 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/assets/logo-cutout.png"
      imagesrcset="/assets/_r/logo-cutout-240.png 240w, /assets/_r/logo-cutout-480.png 480w, /assets/logo-cutout.png 834w"
      imagesizes="62px"
      fetchpriority="high"
    />

    <!--
      Google Tag Manager, loaded *after* first paint rather than during it.
      Lives in the shell (not React) so it also runs on the prerendered HTML.

      `async` only keeps the script from blocking the parser — it does not stop
      GTM from executing on the main thread while the page is still painting.
      Measured on this build (Lighthouse, median of 3, same machine):

                        eager    deferred
        Total Blocking   240 ms      8 ms
        Performance          72        76

      FCP and LCP were identical either way; the whole cost was main-thread
      execution, which is the INP/TBT budget. Same requestIdleCallback idiom the
      decorative layers use — see src/hooks/use-after-paint.ts.

      dataLayer is created synchronously, so anything pushed before GTM loads is
      still queued and replayed. Loading starts at whichever comes first:
      first interaction, browser idle after load, or a 3 s backstop — so no
      realistic visit goes unrecorded. To go back to eager loading, call
      start() immediately instead of scheduling it.
    -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || []
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })

        var started = false
        function start() {
          if (started) return
          started = true
          clearTimeout(backstop)
          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s)
          j.async = true
          j.src =
            'https://www.googletagmanager.com/gtm.js?id=' +
            i +
            (l != 'dataLayer' ? '&l=' + l : '')
          f.parentNode.insertBefore(j, f)
        }

        // A visitor who interacts is a visitor worth measuring right now.
        // NOT `scroll`: parallax/scroll-restoration fire it during hydration,
        // which pulled GTM back onto the critical path (measured: loading at
        // 358 ms instead of on idle).
        var opts = { once: true, passive: true, capture: true }
        var events = ['pointerdown', 'keydown', 'touchstart']
        for (var n = 0; n < events.length; n++) {
          w.addEventListener(events[n], start, opts)
        }

        /*
         * Idle-after-load alone was not enough: on a fast connection `load`
         * fires in a few hundred ms and the idle callback ran immediately, so
         * GTM was back on the critical path (measured: requesting at 313 ms,
         * 485 kB — a third of the page's total bytes — and 593 ms of main-thread
         * time). Waiting for a real settle window before even asking for idle is
         * what keeps it out of the paint.
         */
        var backstop = setTimeout(function () {
          if (w.requestIdleCallback) w.requestIdleCallback(start, { timeout: 1500 })
          else start()
        }, 3500)
      })(window, document, 'script', 'dataLayer', 'GTM-PXBN6P5J')
    </script>

    <!--
      Everything between the markers is replaced per route at build time by
      scripts/prerender.mjs (source of truth: src/lib/seo.ts) and re-applied on
      client-side navigation by useDocumentHead(). The defaults below are the
      homepage's, so the raw SPA shell is still correct if prerendering is skipped.
    -->
    <!--seo-head-start-->
    <title>Wedding &amp; Event Venue near Austin | Infinity at Rio Ranch</title>
    <link rel="canonical" href="https://www.infinityrioranch.com/" />
    <meta
      name="description"
      content="Infinity at Rio Ranch is a two-acre wedding and event venue in Liberty Hill, TX, near Austin — 2,600 sq ft indoors, 12,400 sq ft outdoors. Book a tour today."
    />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#0c0a07" />
    <meta name="geo.region" content="US-TX" />
    <meta name="geo.placename" content="Liberty Hill, TX" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Infinity at Rio Ranch" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Wedding &amp; Event Venue near Austin | Infinity at Rio Ranch" />
    <meta
      property="og:description"
      content="A two-acre wedding and event venue in Liberty Hill, TX, near Austin — 2,600 sq ft indoors, 12,400 sq ft outdoors."
    />
    <meta property="og:url" content="https://www.infinityrioranch.com/" />
    <meta property="og:image" content="https://www.infinityrioranch.com/assets/site/DSC3669-2.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--seo-head-end-->
  </head>
  <body>
    <!--
      GTM noscript fallback. Must stay outside #root — React hydrates that
      container against entry-server.tsx's output, and an extra child would be a
      mismatch (error #418 → silent client-render fallback, ~2s of LCP).
    -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-PXBN6P5J"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>

    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
